name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest
      - run: python scripts/evaluate.py --mode fixture --pipeline guarded --split all

  home-assistant-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/prepare_ha_config.py
      - name: Confirm ten reviewed automations are present
        run: python -c "import yaml; assert len(yaml.safe_load(open('tests/ha_config/automations.yaml', encoding='utf-8'))) == 10"
      - name: Check representative configuration with Home Assistant stable
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/tests/ha_config:/config"
          ghcr.io/home-assistant/home-assistant:stable
          python -m homeassistant --script check_config -c /config
